name: qbit_mobile
description: QBIT Mobile App - iOS/Android
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # 공통 패키지
  qbit_shared:
    path: packages/shared
  
  cupertino_icons: ^1.0.8
  kakao_flutter_sdk: ^1.9.5 
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.7.1
  riverpod_generator: ^3.0.1
  riverpod_lint: ^3.0.1
  custom_lint: ^0.8.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/characters/
    - .env
  
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Thin.woff2
          weight: 100
        - asset: assets/fonts/Pretendard-ExtraLight.woff2
          weight: 200
        - asset: assets/fonts/Pretendard-Light.woff2
          weight: 300
        - asset: assets/fonts/Pretendard-Regular.woff2
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.woff2
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.woff2
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.woff2
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.woff2
          weight: 800
        - asset: assets/fonts/Pretendard-Black.woff2
          weight: 900