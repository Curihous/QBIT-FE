name: qbit_workspace
description: "QBIT Frontend Workspace - 멀티플랫폼 프로젝트"
publish_to: 'none'

# 워크스페이스 루트용 설정
environment:
  sdk: ">=3.6.0 <4.0.0"

# 워크스페이스에서는 의존성을 관리하지 않음
# 각 패키지와 앱에서 개별적으로 관리

# 개발 도구들만 워크스페이스 레벨에서 관리
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.7.1
  riverpod_generator: ^3.0.1
  riverpod_lint: ^3.0.1
  custom_lint: ^0.8.0
  json_serializable: ^6.8.0

# Flutter 설정은 각 앱에서 개별 관리
# 이 파일은 워크스페이스 관리용