name: qbit_mobile
description: QBIT Mobile App - iOS/Android
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # 공통 패키지들
  qbit_shared:
    path: ../../packages/shared
  
  # 플랫폼별 의존성
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.7.1
  riverpod_generator: ^3.0.1
  riverpod_lint: ^3.0.1
  custom_lint: ^0.8.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  
  assets:
    - ../../assets/images/
    - .env
