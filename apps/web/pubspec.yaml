name: qbit_web
description: QBIT Web App
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # 공통 패키지들
  qbit_core:
    path: ../../packages/core
  qbit_services:
    path: ../../packages/services
  qbit_shared:
    path: ../../packages/shared
  
  # 웹 전용 의존성
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.1
  riverpod_annotation: ^3.0.1
  go_router: ^16.2.4
  flutter_secure_storage: ^4.2.1
  dio: ^5.9.0
  json_annotation: ^4.9.0
  url_launcher: ^6.3.1
  logger: ^2.0.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.7.1
  riverpod_generator: ^3.0.1
  riverpod_lint: ^3.0.1
  custom_lint: ^0.8.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  
  assets:
    - ../../assets/images/
    - .env
